---
- name: Установка Docker и Docker Compose на виртуальную машину
  hosts: app
  become: true

  vars:
    docker_user: "{{ ansible_user }}"

  tasks:
    - name: Установить зависимости для работы с репозиториями
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - apt-transport-https
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Создать каталог для GPG-ключей
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Загрузить GPG-ключ репозитория Docker
      ansible.builtin.command:
        cmd: >
          bash -c "curl -fsSL https://download.docker.com/linux/ubuntu/gpg
          | gpg --dearmor -o /etc/apt/keyrings/docker.gpg"
        creates: /etc/apt/keyrings/docker.gpg

    - name: Установить права на GPG-ключ
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.gpg
        mode: "0644"

    - name: Подключить репозиторий Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Установить Docker Engine и плагин Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Включить и запустить службу Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Добавить пользователя в группу docker
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true

    - name: Создать каталог приложения
      ansible.builtin.file:
        path: /opt/diploma-app
        state: directory
        owner: "{{ docker_user }}"
        group: "{{ docker_user }}"
        mode: "0755"

    - name: Получить версию Docker
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Получить версию Docker Compose
      ansible.builtin.command: docker compose version
      register: compose_version
      changed_when: false

    - name: Показать установленные версии
      ansible.builtin.debug:
        msg:
          - "{{ docker_version.stdout }}"
          - "{{ compose_version.stdout }}"
